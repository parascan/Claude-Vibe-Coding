tructions:"Hold dumbbells at your sides, slight bend in elbows. Raise arms out to the sides until parallel with the floor. Lower slowly.",tip:"Start at 10–12.5 lb each. Shoulders fatigue fast — slow and controlled beats heavy.",startWeight:"10 lb each",isCardio:!1,demoImages:[`${G}/Side_Lateral_Raise/0.jpg`,`${G}/Side_Lateral_Raise/1.jpg`]},{id:"dumbbell-bicep-curl",name:"Dumbbell Bicep Curl",muscles:["arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Stand with dumbbells at your sides, palms facing forward. Curl both weights up toward your shoulders, keeping elbows pinned to your sides. Lower slowly under control.",tip:"Start at 17.5–20 lb each. Slow the lowering phase to 3 counts — that's where the gains are.",startWeight:"17.5 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Bicep_Curl/0.jpg`,`${G}/Dumbbell_Bicep_Curl/1.jpg`]},{id:"hammer-curl",name:"Hammer Curl",muscles:["arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold dumbbells at your sides with palms facing each other (neutral grip). Curl both weights up, keeping elbows stationary. Lower slowly. Targets the brachialis and forearms.",tip:"Start at 20 lb each. Keep your wrists straight — don't let them bend.",startWeight:"20 lb each",isCardio:!1,demoImages:[`${G}/Hammer_Curls/0.jpg`,`${G}/Hammer_Curls/1.jpg`]},{id:"tricep-overhead-extension",name:"Overhead Tricep Extension",muscles:["arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold one dumbbell with both hands overhead, arms extended. Bend your elbows to lower the weight behind your head, then press back up. Keep upper arms stationary.",tip:"Start at 20–25 lb. This is one of the best exercises for the long head of the tricep.",startWeight:"20 lb",isCardio:!1,demoImages:[`${G}/Dumbbell_Seated_Triceps_Extension/0.jpg`,`${G}/Dumbbell_Seated_Triceps_Extension/1.jpg`]},{id:"tricep-kickback",name:"Tricep Kickback",muscles:["arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hinge forward at the hips, upper arms parallel to the floor. Extend your forearms back until your arms are fully straight, squeezing the triceps. Lower slowly. Switch sides at half time.",tip:"Start at 12.5–15 lb each. Full extension is key — don't shortcut the lockout.",startWeight:"12.5 lb each",isCardio:!1,demoImages:[`${G}/Triceps_Kickback/0.jpg`,`${G}/Triceps_Kickback/1.jpg`]},{id:"skull-crusher",name:"Skull Crusher (Floor)",muscles:["arms","chest"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, dumbbells pressed up over your chest. Keeping your upper arms vertical, bend your elbows to lower the weights toward your temples. Press back to start.",tip:"Start at 15 lb each. Slow and controlled — don't let momentum take over.",startWeight:"15 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Lying_Triceps_Extension/0.jpg`,`${G}/Dumbbell_Lying_Triceps_Extension/1.jpg`]},{id:"dead-bug",name:"Dead Bug",muscles:["core"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, arms pointing at the ceiling, knees bent at 90° above your hips. Slowly lower your right arm and left leg toward the floor, keeping your lower back pressed flat. Return and switch sides.",tip:"Bodyweight. Go slow — this is all about spinal stability, not speed.",startWeight:"bodyweight",isCardio:!1,demoImages:[`${G}/Dead_Bug/0.jpg`,`${G}/Dead_Bug/1.jpg`]},{id:"bicycle-crunch",name:"Bicycle Crunch",muscles:["core"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, hands behind your head. Bring one knee in as you rotate your opposite elbow toward it, then switch in a pedaling motion. Keep your lower back on the floor.",tip:"Bodyweight. Slow it down — rushing loses the rotation that makes this effective.",startWeight:"bodyweight",isCardio:!1,demoImages:[`${G}/Bicycle_Crunch/0.jpg`,`${G}/Bicycle_Crunch/1.jpg`]},{id:"mountain-climber",name:"Mountain Climber",muscles:["core","full-body"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Start in a push-up position, body straight. Drive one knee toward your chest, then quickly switch legs. Keep your hips level.",tip:"Bodyweight. Keep it fast for more cardio, or slow it down to make it harder on your core.",startWeight:"bodyweight",isCardio:!0,demoImages:[`${G}/Mountain_Climbers/0.jpg`,`${G}/Mountain_Climbers/1.jpg`]},{id:"plank",name:"Plank Hold",muscles:["core"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Forearms on the floor, elbows under shoulders. Body in a straight line from head to heels. Squeeze your core and glutes. Hold.",tip:"Bodyweight. Don't let your hips sag or pike up. Breathe steadily.",startWeight:"bodyweight",isCardio:!1,demoImages:[`${G}/Plank/0.jpg`,`${G}/Plank/1.jpg`]},{id:"dumbbell-russian-twist",name:"Dumbbell Russian Twist",muscles:["core"],equipment:["selecttech-552","bodyweight"],workSeconds:40,restSeconds:20,instructions:"Sit with knees bent and feet slightly raised. Hold one dumbbell with both hands. Rotate your torso left then right, tapping the dumbbell toward the floor.",tip:"Start at 10–12.5 lb, progress to 17.5–20 lb. Keep your back straight.",startWeight:"10 lb",isCardio:!1,demoImages:[`${G}/Russian_Twist/0.jpg`,`${G}/Russian_Twist/1.jpg`]},{id:"dumbbell-swing",name:"Dumbbell Swing",muscles:["glutes","legs","back","core"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold one dumbbell with both hands. Hinge at hips, swing the weight between your legs, then drive your hips forward to swing it to shoulder height.",tip:"Start at 25 lb, progress to 35–40 lb. Power comes from your hips, not your arms.",startWeight:"25 lb",isCardio:!0,demoImages:[`${G}/One-Arm_Kettlebell_Swings/0.jpg`,`${G}/One-Arm_Kettlebell_Swings/1.jpg`]},{id:"burpee",name:"Burpee (No Jump)",muscles:["full-body"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"From standing, place hands on floor, step or jump feet back to a push-up position, do one push-up, step or jump feet forward, then stand back up.",tip:"Bodyweight. Step feet instead of jumping to protect your joints.",startWeight:"bodyweight",isCardio:!0,demoImages:[`${G}/Burpees/0.jpg`,`${G}/Burpees/1.jpg`]},{id:"dumbbell-thruster",name:"Dumbbell Thruster",muscles:["legs","shoulders","full-body"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold dumbbells at shoulders. Squat down, then as you stand, press the weights overhead in one fluid motion. Lower as you squat again.",tip:"Start at 17.5–20 lb each, progress to 25–30 lb. One of the best fat-burning moves you can do.",startWeight:"17.5 lb each",isCardio:!0,demoImages:[`${G}/Kettlebell_Thruster/0.jpg`,`${G}/Kettlebell_Thruster/1.jpg`]},{id:"pushup-position-row",name:"Push-Up Position Row",muscles:["back","core","arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"In push-up position on dumbbells. Row one dumbbell to your hip while balancing on the other. Lower and alternate sides.",tip:"Start at 20–25 lb. Keep your hips from rotating — that's where the core work is.",startWeight:"20 lb each",isCardio:!1,demoImages:[`${G}/Alternating_Renegade_Row/0.jpg`,`${G}/Alternating_Renegade_Row/1.jpg`]},{id:"dumbbell-side-lunge",name:"Dumbbell Side Lunge & Touch",muscles:["legs","glutes"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold dumbbells at your sides. Step wide to the left, bending your left knee and sitting back into a side lunge, lowering the dumbbells toward the floor. Push back to center. Alternate sides.",tip:"Start at 15 lb each, progress to 22.5–25 lb. Keep the working knee aligned over your foot.",startWeight:"15 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Lunges/0.jpg`,`${G}/Dumbbell_Lunges/1.jpg`]},{id:"dumbbell-lunge-rotation",name:"Lunge with Rotation",muscles:["legs","glutes","core"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold one dumbbell horizontally at chest height. Step forward into a lunge, then rotate your torso toward the front leg. Return to start and alternate legs.",tip:"Start at 12.5–15 lb. The rotation fires your core hard — don't rush it.",startWeight:"12.5 lb",isCardio:!1,demoImages:[`${G}/Dumbbell_Walking_Lunge/0.jpg`,`${G}/Dumbbell_Walking_Lunge/1.jpg`]},{id:"dumbbell-push-press",name:"Dumbbell Push Press",muscles:["shoulders","legs","full-body"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Dumbbells at shoulders, feet shoulder-width. Dip slightly at the knees, then explode up and press the weights overhead. Lower under control.",tip:"Start at 20 lb each, progress to 27.5–30 lb. Use the leg drive — that's what makes it a fat burner.",startWeight:"20 lb each",isCardio:!0,demoImages:[`${G}/Push_Press/0.jpg`,`${G}/Push_Press/1.jpg`]},{id:"romanian-deadlift",name:"Romanian Deadlift",muscles:["glutes","back","legs"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold dumbbells in front of your thighs. Hinge at the hips, pushing them back as the weights slide down your legs. Keep your back flat and knees soft. Drive your hips forward to stand.",tip:"Start at 25 lb each, progress to 35–40 lb. Feel the stretch in your hamstrings at the bottom.",startWeight:"25 lb each",isCardio:!1,demoImages:[`${G}/Romanian_Deadlift/0.jpg`,`${G}/Romanian_Deadlift/1.jpg`]},{id:"single-leg-rdl",name:"Single-Leg Romanian Deadlift",muscles:["glutes","legs","core"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold one dumbbell in your right hand. Balance on your left leg, hinge at the hip as you lower the weight toward the floor, extending your right leg behind you. Return to standing. Switch sides halfway.",tip:"Start at 17.5–20 lb. Focus on balance and hip hinge — this is as much core work as it is glute work.",startWeight:"17.5 lb",isCardio:!1,demoImages:[`${G}/Single-Leg_Romanian_Deadlift/0.jpg`,`${G}/Single-Leg_Romanian_Deadlift/1.jpg`]},{id:"bulgarian-split-squat",name:"Bulgarian Split Squat",muscles:["legs","glutes"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Rest your rear foot on a chair or couch behind you. Hold dumbbells at your sides. Lower your back knee toward the floor, keeping your front shin vertical. Drive back up. Switch legs halfway.",tip:"Start at 15 lb each, progress to 22.5–25 lb. This torches your quads and glutes harder than a regular lunge.",startWeight:"15 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Bulgarian_Split_Squat/0.jpg`,`${G}/Dumbbell_Bulgarian_Split_Squat/1.jpg`]},{id:"rear-delt-fly",name:"Rear Delt Fly",muscles:["back","shoulders"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hinge forward at the hips, arms hanging down, palms facing each other. With a slight bend in your elbows, raise both arms out to the sides until they're at shoulder height. Squeeze your shoulder blades together at the top.",tip:"Start at 10–12.5 lb each. This targets the rear delts and upper back — go light and feel it.",startWeight:"10 lb each",isCardio:!1,demoImages:[`${G}/Seated_Bent-Over_Rear_Delt_Raise/0.jpg`,`${G}/Seated_Bent-Over_Rear_Delt_Raise/1.jpg`]},{id:"arnold-press",name:"Arnold Press",muscles:["shoulders","arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Start with dumbbells at shoulder height, palms facing you (like a curl finish). As you press overhead, rotate your palms forward so they face away at the top. Reverse on the way down.",tip:"Start at 15–17.5 lb each. The rotation hits all three heads of the deltoid — it's worth the complexity.",startWeight:"15 lb each",isCardio:!1,demoImages:[`${G}/Arnold_Dumbbell_Press/0.jpg`,`${G}/Arnold_Dumbbell_Press/1.jpg`]},{id:"dumbbell-chest-fly",name:"Dumbbell Floor Fly",muscles:["chest"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, dumbbells pressed up, palms facing each other. With a slight bend in your elbows, slowly open your arms wide until you feel a stretch in your chest. Squeeze back to the top.",tip:"Start at 15–17.5 lb each. This is an isolation move — don't go too heavy. Feel the stretch.",startWeight:"15 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Flyes/0.jpg`,`${G}/Dumbbell_Flyes/1.jpg`]},{id:"diamond-pushup",name:"Diamond Push-Up",muscles:["arms","chest"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Get in a push-up position with your hands close together, thumbs and index fingers touching to form a diamond shape. Keep your elbows tight to your sides as you lower your chest to your hands, then press back up.",tip:"Bodyweight. Triceps will burn fast — drop to knees if needed. The narrow hand position is what makes this a tricep killer.",startWeight:"bodyweight",isCardio:!1,demoImages:[`${G}/Close-Grip_Push-Up/0.jpg`,`${G}/Close-Grip_Push-Up/1.jpg`]},{id:"close-grip-floor-press",name:"Close-Grip Floor Press",muscles:["arms","chest"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, dumbbells held together at chest height with palms facing each other, elbows tight to your sides. Press straight up, squeezing the weights together the whole way. Lower slowly.",tip:"Start at 17.5–20 lb each. Keep the weights pressed together throughout — that squeeze fires the inner chest and triceps.",startWeight:"17.5 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Floor_Press/0.jpg`,`${G}/Dumbbell_Floor_Press/1.jpg`]},{id:"dumbbell-pullover",name:"Dumbbell Pullover",muscles:["chest","back"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, holding one dumbbell with both hands above your chest, arms nearly straight. Slowly lower the weight back behind your head in an arc until you feel a stretch across your chest. Pull it back over your chest.",tip:"Start at 20–25 lb. Keep a slight bend in your elbows throughout. Breathe in as you lower, out as you pull back.",startWeight:"20 lb",isCardio:!1,demoImages:[`${G}/Dumbbell_Pullover/0.jpg`,`${G}/Dumbbell_Pullover/1.jpg`]},{id:"concentration-curl",name:"Concentration Curl",muscles:["arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Sit on a chair or bench, lean forward slightly. Rest your elbow on your inner thigh. Curl one dumbbell up toward your shoulder with full control. Switch arms halfway through.",tip:"Start at 17.5–20 lb. This isolates the bicep peak more than any other curl. Slow and squeeze at the top.",startWeight:"17.5 lb",isCardio:!1,demoImages:[`${G}/Dumbbell_Concentration_Curls/0.jpg`,`${G}/Dumbbell_Concentration_Curls/1.jpg`]},{id:"zottman-curl",name:"Zottman Curl",muscles:["arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Curl both dumbbells up with palms facing up (supinated). At the top, rotate your wrists so palms face down (pronated), then lower slowly. Rotate back to the start and repeat.",tip:"Start at 15–17.5 lb each. The pronated lowering hits the brachialis and forearms hard — don't rush the eccentric.",startWeight:"15 lb each",isCardio:!1,demoImages:[`${G}/Zottman_Curl/0.jpg`,`${G}/Zottman_Curl/1.jpg`]},{id:"leg-raise",name:"Lying Leg Raise",muscles:["core"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Lie flat on your back, hands under your glutes for support. Keeping legs straight (or slightly bent), raise them together to 90°, then lower slowly without letting your heels touch the floor.",tip:"Bodyweight. Press your lower back into the floor the entire time. The lower you bring your legs, the harder it gets.",startWeight:"bodyweight",isCardio:!1,demoImages:[`${G}/Flat_Bench_Lying_Leg_Raise/0.jpg`,`${G}/Flat_Bench_Lying_Leg_Raise/1.jpg`]},{id:"hollow-hold",name:"Hollow Hold",muscles:["core"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Lie on your back and press your lower back firmly into the floor. Lift your shoulders and legs off the ground so your body forms a shallow dish shape. Arms reach overhead or cross your chest. Hold the position.",tip:"Bodyweight. If your lower back lifts, bend your knees or raise your legs higher. This is a gymnastics core staple.",startWeight:"bodyweight",isCardio:!1,demoImages:[`${G}/Crunch/0.jpg`,`${G}/Crunch/1.jpg`]},{id:"chest-supported-row",name:"Chest-Supported Row",muscles:["back","arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Set a chair at a slight incline or use a couch arm. Lie chest-down, letting your arms hang. Row both dumbbells up toward your hips, squeezing your shoulder blades together. Lower with control.",tip:"Start at 20–25 lb each. This removes lower-back fatigue from the equation — pure back contraction. Pause 1 second at the top.",startWeight:"20 lb each",isCardio:!1,demoImages:[`${G}/Bent_Over_Two-Dumbbell_Row/0.jpg`,`${G}/Bent_Over_Two-Dumbbell_Row/1.jpg`]},{id:"dumbbell-shrug",name:"Dumbbell Shrug",muscles:["back","shoulders"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Stand holding heavy dumbbells at your sides. Shrug your shoulders straight up toward your ears as high as possible, hold 1 second, then lower slowly. Keep your arms straight throughout.",tip:"Start at 35–40 lb each — go heavier than you think. Traps respond to load. Don't roll your shoulders; straight up and down.",startWeight:"35 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Shrug/0.jpg`,`${G}/Dumbbell_Shrug/1.jpg`]},{id:"upright-row",name:"Dumbbell Upright Row",muscles:["shoulders","back"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hold dumbbells in front of your thighs, palms facing you. Pull them straight up along your body, leading with your elbows until they reach chin height. Lower slowly.",tip:"Start at 17.5–20 lb each. Keep the weights close to your body and let your elbows flare out and up.",startWeight:"17.5 lb each",isCardio:!1,demoImag
