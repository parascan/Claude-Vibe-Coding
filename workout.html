Floor_Press/1.jpg`]},{id:"t-pushup",name:"T Push-Up",muscles:["chest","shoulders","core"],equipment:["selecttech-552","bodyweight"],workSeconds:40,restSeconds:20,instructions:"Start in a push-up position gripping the dumbbells. Do a push-up, then rotate your body to one side and raise one arm toward the ceiling forming a T. Alternate sides.",tip:"Use 15–20 lb or no weight at all. Balance is the challenge here.",startWeight:"15 lb each",isCardio:!1,demoImages:[`${G}/Pushup_to_Side_Plank/0.jpg`,`${G}/Pushup_to_Side_Plank/1.jpg`]},{id:"dumbbell-row",name:"Dumbbell Row",muscles:["back","arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hinge at hips, back nearly parallel to the floor, dumbbells hanging. Pull both weights to your sides, squeezing your shoulder blades together at the top.",tip:"Start at 25 lb each, progress to 35–40 lb. Pause 1 second at the top.",startWeight:"25 lb each",isCardio:!1,demoImages:[`${G}/Bent_Over_Two-Dumbbell_Row/0.jpg`,`${G}/Bent_Over_Two-Dumbbell_Row/1.jpg`]},{id:"single-arm-row",name:"Single-Arm Row",muscles:["back","arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Place one hand and knee on a chair for support. Row the dumbbell to your hip, elbow close to your body. Switch arms at the halfway point.",tip:"Start at 30 lb, progress to 40–45 lb. Pull with your back, not your arm.",startWeight:"30 lb",isCardio:!1,demoImages:[`${G}/One-Arm_Dumbbell_Row/0.jpg`,`${G}/One-Arm_Dumbbell_Row/1.jpg`]},{id:"dumbbell-shoulder-press",name:"Dumbbell Shoulder Press",muscles:["shoulders","arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Stand or sit, dumbbells at shoulder height, elbows at 90°. Press overhead until arms are nearly straight, then lower slowly.",tip:"Start at 17.5–20 lb each, progress to 25–30 lb. Don't lock your elbows at the top.",startWeight:"17.5 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Shoulder_Press/0.jpg`,`${G}/Dumbbell_Shoulder_Press/ l_Seated_Triceps_Extension/1.jpg`]},{id:"tricep-kickback",name:"Tricep Kickback",muscles:["arms"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Hinge forward at the hips, upper arms parallel to the floor. Extend your forearms back until your arms are fully straight, squeezing the triceps. Lower slowly. Switch sides at half time.",tip:"Start at 12.5–15 lb each. Full extension is key — don't shortcut the lockout.",startWeight:"12.5 lb each",isCardio:!1,demoImages:[`${G}/Triceps_Kickback/0.jpg`,`${G}/Triceps_Kickback/1.jpg`]},{id:"skull-crusher",name:"Skull Crusher (Floor)",muscles:["arms","chest"],equipment:["selecttech-552"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, dumbbells pressed up over your chest. Keeping your upper arms vertical, bend your elbows to lower the weights toward your temples. Press back to start.",tip:"Start at 15 lb each. Slow and controlled — don't let momentum take over.",startWeight:"15 lb each",isCardio:!1,demoImages:[`${G}/Dumbbell_Lying_Triceps_Extension/0.jpg`,`${G}/Dumbbell_Lying_Triceps_Extension/1.jpg`]},{id:"dead-bug",name:"Dead Bug",muscles:["core"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, arms pointing at the ceiling, knees bent at 90° above your hips. Slowly lower your right arm and left leg toward the floor, keeping your lower back pressed flat. Return and switch sides.",tip:"Bodyweight. Go slow — this is all about spinal stability, not speed.",startWeight:"bodyweight",isCardio:!1,demoImages:[`${G}/Dead_Bug/0.jpg`,`${G}/Dead_Bug/1.jpg`]},{id:"bicycle-crunch",name:"Bicycle Crunch",muscles:["core"],equipment:["bodyweight"],workSeconds:40,restSeconds:20,instructions:"Lie on your back, hands behind your head. Bring one knee in as you rotate your opposite elbow toward it, then switch in a pedaling motion. Keep your lower back on the floor.",tip:"Bodyweight. Slow it down — rushing loses the rotation that makes this effective.",startWeight:"bodywei
