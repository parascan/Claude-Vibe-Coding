name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug versions
        run: |
          node --version
          npm --version
          ls -la

      - name: Install workout app
        working-directory: workout-app
        run: npm install

      - name: Build workout app
        working-directory: workout-app
        run: npm run build

      - name: Install wishlist app
        working-directory: wishlist-app
        run: npm install

      - name: Build wishlist app
        working-directory: wishlist-app
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/kids-wishlist
          cp -r workout-app/dist/. _site/
          cp -r wishlist-app/dist/. _site/kids-wishlist/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
